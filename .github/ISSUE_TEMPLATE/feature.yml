name: Feature request
description: An idea for PumboBridge
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem or the use case, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Commands, config options, what players or admins would see.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, other plugins that do it.
