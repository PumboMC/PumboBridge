# Format, lints, tests, the dependency policy and the plugin builds on every
# pull request into main and every push to main. Branch protection can
# require the job "check". RustSec advisories run in audit.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Without debug info in test builds; with it the runner disk fills up.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      # The version, components and targets come from rust-toolchain.toml.
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      - name: cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The plugin builds as build.sh makes them: Pumpkin 0.2.1 (default
      # features), Pumpkin 26.2 (mc262) and PumboProx, where the plugin has one.
      - name: Clippy for WebAssembly
        run: |
          cargo clippy -p pumbo-bridge-pumpkin --target wasm32-wasip2 --locked -- -D warnings
          cargo clippy -p pumbo-bridge-pumpkin --target wasm32-wasip2 --no-default-features --features mc262 \
            --target-dir target/mc262 --locked -- -D warnings
          if [ -d plugins/pumbo-bridge-prox ]; then
            cargo clippy -p pumbo-bridge-prox --target wasm32-wasip2 --target-dir target/bridge-prox --locked -- -D warnings
          fi
      - name: Tests
        run: cargo test --workspace --locked
      - name: Dependency policy
        run: cargo deny --locked check bans licenses sources
      - name: Build
        run: for b in plugins/*/build.sh; do "$b"; done
      # build.sh pins the lockfile to api 0.2.0 for one file and must put it back.
      - name: Lockfile unchanged
        run: git diff --exit-code Cargo.lock

  # Pumpkin is moving plugins to wasm32-wasip3. This job builds the Pumpkin
  # plugin for it and keeps the file for 14 days. Releases stay on
  # wasm32-wasip2 until a Pumpkin release loads the wasm32-wasip3 file
  # (Pumpkin 0.2.2 refuses it from plugins on plugin API 0.1).
  wasip3:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip3
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Build
        run: cargo build -p pumbo-bridge-pumpkin --release --target wasm32-wasip3 --locked
      - name: Keep the plugin file
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wasip3
          path: target/wasm32-wasip3/release/pumbo_bridge_pumpkin.wasm
          retention-days: 14
