# Format, lints, tests, the dependency policy and the plugin builds on every
# pull request into dev or main and every push to dev. Branch protection can
# require the job "check".
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Without debug info in test builds; with it the runner disk fills up.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy -t wasm32-wasip2
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The plugin builds as build.sh makes them: Pumpkin 26.3 (default
      # features), Pumpkin 26.2 (mc262) and PumboProx, where the plugin has one.
      - name: Clippy for WebAssembly
        run: |
          cargo clippy -p pumbo-bridge-pumpkin --target wasm32-wasip2 --locked -- -D warnings
          cargo clippy -p pumbo-bridge-pumpkin --target wasm32-wasip2 --no-default-features --features mc262 \
            --target-dir target/mc262 --locked -- -D warnings
          if [ -d plugins/pumbo-bridge-prox ]; then
            cargo clippy -p pumbo-bridge-prox --target wasm32-wasip2 --target-dir target/bridge-prox --locked -- -D warnings
          fi
      - name: Tests
        run: cargo test --workspace --locked
      - name: Dependency policy
        run: cargo deny --locked check
      - name: Build
        run: for b in plugins/*/build.sh; do "$b"; done
